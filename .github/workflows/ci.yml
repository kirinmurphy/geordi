name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the older run immediately.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (make verify)
    # macos-26 defaults to Xcode 26.6 (17F113) — the same toolchain the
    # code is formatted and verified against locally. Unpinned
    # latest-stable drifted and failed format-check within ~1 minute.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Verify (format-check, tests, fixtures, build, bundle smoke)
        run: make verify

  cli:
    name: CLI (python stdlib, ${{ matrix.python-version }})
    runs-on: macos-15
    strategy:
      matrix:
        # 3.9 = what a fresh Mac ships via Xcode CLT (the user-machine floor);
        # 3.13 = the newest behavior runner images ship. The stdlib-only
        # sidekick rule means the code must behave identically on both.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run CLI test suite
        run: python3 -m unittest discover -s cli/test

  bootstrap:
    name: Bootstrap (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run bootstrap test suite
        run: npm test --prefix bootstrap
